name: Flutter

on:
  pull_request:
  push:
    branches: [main]

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: bash scripts/check-web-online-only.sh
      - run: flutter build web --release --base-href /
      - name: Web build stays online only
        run: bash scripts/check-web-online-only.sh
