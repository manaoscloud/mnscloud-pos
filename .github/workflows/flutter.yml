name: Flutter

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly Apple builds (macOS runners cost about ten times Linux minutes).
    - cron: "23 6 * * 2"
  workflow_dispatch:


# Read-only token: analysis, tests and builds publish nothing.
permissions:
  contents: read

jobs:
  client:
    # Shared MNSCloud Flutter client gate (docs/flutter-client-standard.md in the workspace):
    # pinned toolchain, native configuration check, analyze, test and one build per target.
    # Installed targets carry the local-first offline sales; the web build stays online only.
    uses: manaoscloud/mnscloud-runtime-kit/.github/workflows/flutter-client-ci.yml@main
    with:
      targets: "web,android,linux,windows,macos,ios"
      web_mode: plain
      web_check: bash scripts/check-web-online-only.sh
      native_check_args: >-
        --macos-entitlement com.apple.security.device.camera
        --ios-plist-key NSCameraUsageDescription
      # flutter_secure_storage on Linux.
      linux_packages: "libsecret-1-dev"
      apple: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

  analyze-test:
    # Required status check of main: passes only when every job of the shared gate passed.
    needs: client
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.client.result }}" = success

  sonarcloud:
    # SonarQube Cloud CI analysis (Dart is not covered by automatic analysis); shared and pinned in
    # mnscloud-runtime-kit. Skipped with a notice while SONAR_TOKEN is not available.
    uses: manaoscloud/mnscloud-runtime-kit/.github/workflows/sonarcloud-dart.yml@main
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  security:
    # Shared security gate (Gitleaks, Trivy, Opengrep), pinned in mnscloud-runtime-kit.
    uses: manaoscloud/mnscloud-runtime-kit/.github/workflows/security-scan.yml@main
    with:
      # No Dart rule set in opengrep-rules: scan the web loader and scripts only.
      opengrep_rules: "javascript bash"
      opengrep_exclude: "test"
